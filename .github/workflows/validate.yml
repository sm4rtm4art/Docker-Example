name: Validate curriculum
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curriculum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/validate.py static
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py configs
  tracks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        track: [python, rust, java]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, API contract, runtime security and lifecycle
        run: python3 scripts/validate.py track --track '${{ matrix.track }}'
      - name: Development image build and API contract
        if: matrix.track != 'java'
        run: python3 scripts/validate_dev.py --track '${{ matrix.track }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-${{ matrix.track }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
  labs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lab: [database, monitoring]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py '${{ matrix.lab }}' --track python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-${{ matrix.lab }}
          path: reports/
          retention-days: 14
  security-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Populate Maven cache before offline dependency analysis
        run: mvn --batch-mode --file docker-mastery-multitrack/02-language-quickstart/java/pom.xml dependency:go-offline
      # Advisory report: findings require review; this is not a release approval.
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        env:
          TRIVY_OFFLINE_SCAN: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: json
          output: trivy.json
          exit-code: '0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-report
          path: trivy.json
          retention-days: 14

  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - name: Build English course and check references
        run: python -m sphinx -n -W --keep-going -b html -c docs docker-mastery-multitrack _build/html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: course-site-preview
          path: _build/html/
          retention-days: 14
