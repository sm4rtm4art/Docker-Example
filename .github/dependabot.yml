version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uv
    directory: /docker-mastery-multitrack/02-language-quickstart/python
    schedule: {interval: weekly}
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /docker-mastery-multitrack/02-language-quickstart/rust
    schedule: {interval: weekly}
    groups:
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: maven
    directory: /docker-mastery-multitrack/02-language-quickstart/java
    schedule: {interval: weekly}
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories:
      - /docker-mastery-multitrack/02-language-quickstart/python
      - /docker-mastery-multitrack/02-language-quickstart/rust
      - /docker-mastery-multitrack/02-language-quickstart/java
    schedule: {interval: weekly}
    groups:
      docker-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker-compose
    directories:
      - /
      - /docker-mastery-multitrack/common-resources/templates
    schedule: {interval: weekly}
    groups:
      compose-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
