services:
  task-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      # Hot reload source code
      - ./src:/app/src:cached
      - ./Cargo.toml:/app/Cargo.toml:ro
      # Cargo cache for faster builds
      - cargo-cache:/usr/local/cargo/registry
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=debug
      - ENV=development
    networks:
      - dev-network

  # Future: Add PostgreSQL for Module 04
  # postgres:
