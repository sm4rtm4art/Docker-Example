  #     POSTGRES_USER: taskuser
  #     POSTGRES_PASSWORD: taskpass # DEV ONLY local classroom default
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - dev-network

volumes:
  cargo-cache:

networks:
  dev-network:
