# Standalone persistence lab: no Task API database integration is implied.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: learner
      POSTGRES_DB: learning
      # DEV ONLY: local, isolated exercise data. Never reuse for real data.
      POSTGRES_PASSWORD: local-exercise-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  client:
    image: postgres:17-bookworm
    profiles: [tools]
    environment:
      PGPASSWORD: local-exercise-only # DEV ONLY
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [psql, -h, postgres, -U, learner, -d, learning, -v, ON_ERROR_STOP=1]
    command: [-c, SELECT 1;]
    user: postgres
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
networks:
  database:
    internal: true
