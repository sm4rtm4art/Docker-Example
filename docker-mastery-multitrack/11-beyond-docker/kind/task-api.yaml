apiVersion: v1
kind: Namespace
metadata:
  name: docker-learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: docker-learning
spec:
  # Memory storage is per process; more replicas would hold different task lists.
  replicas: 1
  selector:
    matchLabels: {app: task-api}
  template:
    metadata:
      labels: {app: task-api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: task-api
          image: task-api:kind
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: task-api
  namespace: docker-learning
spec:
  selector: {app: task-api}
  ports:
    - {port: 8080, targetPort: 8080}
  type: ClusterIP
